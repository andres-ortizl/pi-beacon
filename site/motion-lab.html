<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Motion lab | Pi Beacon</title>
    <meta
      name="description"
      content="Temporary motion direction comparison for Pi Beacon."
    />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="assets/fonts/Geist-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="motion-lab.css" />
  </head>
  <body class="motion-lab-page">
    <a class="skip-link" href="#preview">Skip to preview</a>
    <header class="lab-header">
      <a class="brand" href="index.html"
        ><span aria-hidden="true">π</span> Beacon</a
      >
      <div>
        <p class="eyebrow">Temporary comparison</p>
        <h1>Motion lab</h1>
      </div>
      <a class="lab-back" href="index.html">Back to landing</a>
    </header>

    <main class="lab-layout">
      <aside class="concept-list" aria-label="Motion concepts">
        <button type="button" data-concept="stroke">
          <span>01</span>Single Stroke Frame
        </button>
        <button type="button" data-concept="gates" class="active">
          <span>02</span>Five Gate Reveal
        </button>
        <button type="button" data-concept="reading">
          <span>03</span>Reading Light
        </button>
        <button type="button" data-concept="plinth">
          <span>04</span>Obsidian Plinth
        </button>
        <button type="button" data-concept="tidal">
          <span>05</span>Tidal Thread
        </button>
        <button type="button" data-concept="eclipse">
          <span>06</span>Eclipse Portal
        </button>
        <button type="button" data-concept="fold">
          <span>07</span>Folded Interface
        </button>
        <button type="button" data-concept="dither">
          <span>08</span>Dither Dawn
        </button>
        <button type="button" data-concept="brush">
          <span>09</span>Brush Trace
        </button>
        <button type="button" data-concept="polar">
          <span>10</span>Polar Ledger
        </button>
      </aside>

      <section class="lab-preview" id="preview" aria-live="polite">
        <header class="preview-header">
          <div>
            <p class="eyebrow" data-concept-number>02</p>
            <h2 data-concept-title>Five Gate Reveal</h2>
            <p data-concept-description>
              Architectural shutters part once and leave the real dashboard
              still.
            </p>
          </div>
          <div class="preview-controls">
            <label class="motion-toggle">
              <input type="checkbox" data-reduced-motion />
              <span>Reduced motion</span>
            </label>
            <button type="button" class="lab-action" data-replay>Replay</button>
          </div>
        </header>

        <p class="interaction-note" data-interaction-note>
          Press Replay to open the five gates.
        </p>

        <div class="prototype-stage" data-stage>
          <div class="prototype" data-prototype="stroke" hidden>
            <div class="shot-frame stroke-frame">
              <img src="assets/dashboard.png" alt="Pi Beacon dashboard" />
              <svg
                class="stroke-overlay"
                viewBox="0 0 470 533"
                aria-hidden="true"
              >
                <rect
                  x="6"
                  y="6"
                  width="458"
                  height="521"
                  rx="18"
                  pathLength="1"
                ></rect>
              </svg>
              <span class="frame-locator" aria-hidden="true">PI / 01</span>
            </div>
          </div>

          <div class="prototype active running" data-prototype="gates">
            <div class="shot-frame gate-frame">
              <img src="assets/dashboard.png" alt="Pi Beacon dashboard" />
              <div class="gate-set" aria-hidden="true">
                <span></span><span></span><span></span><span></span
                ><span></span>
              </div>
            </div>
          </div>

          <div class="prototype" data-prototype="reading" hidden>
            <div class="reading-composition">
              <p
                class="reading-copy"
                aria-label="Keep every Pi session in sight"
              >
                <span>Keep</span> <span>every</span> <span>Pi</span>
                <span>session</span><br />
                <span>in</span> <span>sight.</span>
              </p>
              <img src="assets/dashboard.png" alt="Pi Beacon dashboard" />
            </div>
          </div>

          <div class="prototype" data-prototype="plinth" hidden>
            <div class="plinth-space" data-plinth>
              <span class="plinth-line line-one" aria-hidden="true"></span>
              <span class="plinth-line line-two" aria-hidden="true"></span>
              <img src="assets/dashboard.png" alt="Pi Beacon dashboard" />
              <span class="corner-marker" aria-hidden="true"></span>
            </div>
          </div>

          <div class="prototype" data-prototype="tidal" hidden>
            <div class="tidal-composition">
              <svg class="tidal-line" viewBox="0 0 120 533" aria-hidden="true">
                <path
                  pathLength="1"
                  d="M62 12 C10 105 108 178 53 266 C2 350 109 415 58 521"
                ></path>
                <circle cx="44" cy="120" r="5"></circle>
                <circle cx="63" cy="270" r="5"></circle>
                <circle cx="72" cy="440" r="5"></circle>
              </svg>
              <img src="assets/dashboard.png" alt="Pi Beacon dashboard" />
            </div>
            <label class="scrub-control"
              >Trace position
              <input type="range" min="0" max="100" value="0" data-tidal-range
            /></label>
          </div>

          <div class="prototype" data-prototype="eclipse" hidden>
            <div class="shot-frame eclipse-frame">
              <img src="assets/dashboard.png" alt="Pi Beacon dashboard" />
              <span class="registration-dot" aria-hidden="true"></span>
            </div>
          </div>

          <div class="prototype" data-prototype="fold" hidden>
            <div
              class="fold-composition"
              role="img"
              aria-label="Pi Beacon dashboard unfolding into one image"
            >
              <span class="fold-slice slice-left" aria-hidden="true"></span>
              <span class="fold-slice slice-center" aria-hidden="true"></span>
              <span class="fold-slice slice-right" aria-hidden="true"></span>
            </div>
          </div>

          <div class="prototype" data-prototype="dither" hidden>
            <div class="shot-frame dither-frame">
              <img src="assets/dashboard.png" alt="Pi Beacon dashboard" />
              <svg
                class="dither-overlay"
                viewBox="0 0 470 533"
                aria-hidden="true"
              >
                <defs>
                  <pattern
                    id="dither-cells"
                    width="32"
                    height="32"
                    patternUnits="userSpaceOnUse"
                  >
                    <rect width="20" height="12" x="2" y="4"></rect>
                    <rect width="10" height="10" x="20" y="20"></rect>
                  </pattern>
                </defs>
                <rect width="470" height="533" fill="url(#dither-cells)"></rect>
              </svg>
            </div>
          </div>

          <div class="prototype" data-prototype="brush" hidden>
            <div class="shot-frame brush-frame">
              <img src="assets/dashboard.png" alt="Pi Beacon dashboard" />
              <svg
                class="brush-surface"
                viewBox="0 0 470 533"
                data-brush
                aria-label="Decorative drawing surface"
              >
                <polyline points=""></polyline>
              </svg>
            </div>
          </div>

          <div class="prototype" data-prototype="polar" hidden>
            <div class="polar-composition">
              <img src="assets/dashboard.png" alt="Pi Beacon dashboard" />
              <svg
                class="polar-ledger"
                viewBox="0 0 220 220"
                aria-hidden="true"
              >
                <circle cx="110" cy="110" r="82"></circle>
                <path d="M110 20 A90 90 0 0 1 198 110"></path>
                <path d="M110 200 A90 90 0 0 1 22 110"></path>
                <g class="polar-ticks">
                  <path
                    d="M110 10v16 M160 24l-8 14 M196 60l-14 8 M210 110h-16 M196 160l-14-8 M160 196l-8-14 M110 210v-16 M60 196l8-14 M24 160l14-8 M10 110h16 M24 60l14 8 M60 24l8 14"
                  ></path>
                </g>
                <rect
                  class="polar-marker"
                  x="103"
                  y="5"
                  width="14"
                  height="28"
                  rx="3"
                ></rect>
              </svg>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="motion-lab.js" defer></script>
  </body>
</html>
