name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to publish
        required: true
        default: v1.0.0

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pypi:
    name: Publish to PyPI
    environment: pypi
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ github.event.release.tag_name || inputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
          python-version: "3.13"
      - run: test "$RELEASE_REF" = "v$(uv version --short)"
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest
      - run: uv build
      - name: Publish to PyPI if needed
        run: |
          package_version=$(uv version --short)
          if curl --fail --silent --output /dev/null \
            "https://pypi.org/pypi/pi-beacon/$package_version/json"; then
            echo "pi-beacon $package_version is already on PyPI"
          else
            uv publish --trusted-publishing always dist/*
          fi

  npm:
    name: Publish to npm
    environment: npm
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ github.event.release.tag_name || inputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release version
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "$RELEASE_REF" = "v$package_version"
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run typecheck
      - name: Publish to npm if needed
        run: |
          package_version=$(node -p "require('./package.json').version")
          if npm view "pi-beacon@$package_version" version >/dev/null 2>&1; then
            echo "pi-beacon $package_version is already on npm"
          else
            npm publish --access public --provenance
          fi
