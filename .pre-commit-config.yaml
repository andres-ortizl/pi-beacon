repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        pass_filenames: false
      - id: biome-prettier
        name: Biome and Prettier check
        entry: npm run format:check
        language: system
        pass_filenames: false
      - id: zizmor
        name: GitHub Actions security check
        entry: uv run zizmor .github/workflows
        language: system
        pass_filenames: false
      - id: typescript
        name: TypeScript check
        entry: npm run typecheck
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
